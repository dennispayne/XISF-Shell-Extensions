name: Refresh Sharpless catalog from VizieR

on:
  workflow_dispatch:
  schedule:
    # Quarterly sanity check; expected to be a no-op since VizieR VII/20
    # is a historical catalog (Sharpless 1959). Re-runs detect upstream
    # corrections or silent format changes from CDS.
    - cron: '0 6 1 */3 *'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        # urllib (stdlib) is sufficient; requests installed for parity
        # with the workflow spec and easy local extension.
        run: pip install requests

      - name: Fetch from VizieR and regenerate data/sharpless.csv
        run: python scripts/refresh_sharpless_from_vizier.py

      - name: Verify LF line endings
        run: |
          if grep -lU $'\r' data/sharpless.csv >/dev/null 2>&1; then
            echo "::error::data/sharpless.csv contains CR bytes; expected LF-only"
            exit 1
          fi

      - name: Compute new SHA-256
        id: hash
        run: |
          sha=$(sha256sum data/sharpless.csv | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "New SHA-256: $sha"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet data/sharpless.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected; data/sharpless.csv is byte-identical to the version on main."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected. Row delta:"
            git --no-pager diff --stat data/sharpless.csv
          fi

      - name: Update CatalogSpec.h kSharpless.expectedSha256
        if: steps.diff.outputs.changed == 'true'
        env:
          NEW_SHA: ${{ steps.hash.outputs.sha }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          new_sha = os.environ["NEW_SHA"]
          if not re.fullmatch(r"[0-9a-f]{64}", new_sha):
              sys.exit(f"refusing to write malformed SHA-256: {new_sha!r}")

          path = pathlib.Path(
              "ShellExtensionHost/ShellExtensionHost/src/CatalogSpec.h"
          )
          src = path.read_text(encoding="utf-8")

          # Replace the 64-char hex literal that follows the URL line(s)
          # inside the kSharpless block. The URL itself (which embeds
          # kXISFDataCommit) is intentionally NOT touched here -- that
          # bumps to the merge-commit SHA in a follow-up PR.
          pattern = re.compile(
              r'(kSharpless\s*\{[^}]*?)L"[0-9a-fA-F]{64}"',
              re.DOTALL,
          )
          new_src, n = pattern.subn(
              lambda m: m.group(1) + f'L"{new_sha}"', src, count=1
          )
          if n != 1:
              sys.exit(
                  f"expected exactly 1 SHA replacement in kSharpless block, got {n}. "
                  "CatalogSpec.h structure may have changed; update this workflow."
              )
          path.write_text(new_src, encoding="utf-8")
          print(f"updated kSharpless.expectedSha256 -> {new_sha}")
          PY

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: bot/refresh-sharpless
          delete-branch: true
          title: 'data: refresh Sharpless catalog from VizieR (VII/20)'
          commit-message: |
            data: refresh sharpless.csv from VizieR

            Auto-generated by .github/workflows/refresh-sharpless.yml.
            New SHA-256: ${{ steps.hash.outputs.sha }}

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          body: |
            Automated refresh of `data/sharpless.csv` from VizieR catalog
            **VII/20** ("Catalogue of HII Regions", Sharpless 1959).

            **New SHA-256:** `${{ steps.hash.outputs.sha }}`

            **Reviewer checklist:**
            - [ ] Diff looks reasonable (no wholesale row reordering, plausible row count: VizieR VII/20 has 313 entries)
            - [ ] CI passes (the SHA-256 in `kSharpless.expectedSha256` was bumped automatically; if CI fails on hash mismatch the parse logic in `scripts/refresh_sharpless_from_vizier.py` is wrong)
            - [ ] After merge, open a follow-up PR to bump `kXISFDataCommit` (and the embedded commit SHA in `kSharpless.url` / `kConstellations.url`) to the merge commit SHA. The merge commit SHA cannot be known until merge, so this is a deliberate two-step process.

            **Source query:** `https://vizier.cds.unistra.fr/viz-bin/asu-tsv?-source=VII/20/catalog&-out.add=_RAJ2000,_DEJ2000&-out=Sh2,Diam,Form,Struct,Bright`

            **Constellation column** is computed locally from
            `data/constellations.csv` (Roman 1987 / Delporte 1930
            J2000.0 boundary table) using the same algorithm as
            `ConstellationDB::Identify`, since VII/20 itself does not
            ship a constellation field.
