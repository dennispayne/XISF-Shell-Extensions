name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override version (for manual runs). Leave blank to use version.json.'
        required: false

permissions:
  contents: write  # needed to create a GitHub Release

jobs:
  release:
    name: Build + Package + Release
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $override = '${{ github.event.inputs.version_override }}'
          if ($override) {
            $v = $override
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = (Get-Content version.json | ConvertFrom-Json).version
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z\.\-]+)?$') {
            throw "Version '$v' is not a valid SemVer."
          }
          $core = ($v -split '-')[0]
          "version=$core"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "full_version=$v"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$v"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build solution
        shell: pwsh
        run: |
          msbuild Win11-XISF-Shell-Extensions.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:XISFVersion=${{ steps.ver.outputs.version }} `
            /p:XISFBuildNumber=${{ github.run_number }} `
            /m /v:minimal /nologo

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.3

      - name: Download OpenNGC catalogs
        shell: pwsh
        run: |
          $catalogDir = Join-Path $env:LOCALAPPDATA 'XISFShellExtension\catalogs'
          New-Item -ItemType Directory -Path $catalogDir -Force | Out-Null
          $catalogs = @(
            @{
              Name = 'NGC.csv'
              Url  = 'https://raw.githubusercontent.com/mattiaverga/OpenNGC/36cb178a0f69dba8bfc03a99c10512831edf1c6b/database_files/NGC.csv'
              Sha256 = '840fe0c9ee1332e551b2e722a0e92726cd7b157914a3d2177602832aadd3aa9e'
            },
            @{
              Name = 'addendum.csv'
              Url  = 'https://raw.githubusercontent.com/mattiaverga/OpenNGC/36cb178a0f69dba8bfc03a99c10512831edf1c6b/database_files/addendum.csv'
              Sha256 = '1d8f0914e643ada325a5a94d88d8fefad6a4937a2f77cc34f21483af22b11983'
            }
          )
          foreach ($cat in $catalogs) {
            $dest = Join-Path $catalogDir $cat.Name
            Invoke-WebRequest -Uri $cat.Url -OutFile $dest -UseBasicParsing
            $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
            if ($hash -ne $cat.Sha256) {
              throw "SHA-256 mismatch for $($cat.Name): expected $($cat.Sha256), got $hash"
            }
            Write-Host "OK  $($cat.Name) ($hash)"
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          $tests = @(
            'x64\Release\XISFPropertyHandlerTests.dll',
            'x64\Release\XISFPreviewHandlerTests.dll',
            'x64\Release\ShellExtensionHostTests.dll',
            'x64\Release\XISFFilterTests.dll'
          ) | Where-Object { Test-Path $_ }
          vstest.console.exe $tests --Platform:x64 --Logger:trx --ResultsDirectory:TestResults

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet build Installer\XISFInstaller\XISFInstaller.wixproj `
            -c Release `
            -p:XISFVersion=${{ steps.ver.outputs.version }}

      - name: Run installer tests
        shell: pwsh
        run: |
          Invoke-Pester -Path Installer\XISFInstallerTests\installer.Tests.ps1 `
            -OutputFormat NUnitXml `
            -OutputFile TestResults\installer-tests.xml `
            -PassThru | ForEach-Object {
              if ($_.FailedCount -gt 0) { throw "$($_.FailedCount) installer test(s) failed." }
            }

      - name: Stage release assets
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $msi = Get-ChildItem 'Installer\XISFInstaller\bin\Release\**\*.msi' -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found after build.' }
          $destName = "XISF.ShellExtensions_${{ steps.ver.outputs.version }}_x64.msi"
          Copy-Item $msi.FullName (Join-Path $stage $destName)
          $h = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLower()
          "$h  $destName" | Set-Content (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          "release_dir=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem $stage

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.full_version, '-') }}
          files: |
            ${{ runner.temp }}/release-assets/*.msi
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.full_version }}
          path: |
            ${{ runner.temp }}/release-assets/*.msi
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
