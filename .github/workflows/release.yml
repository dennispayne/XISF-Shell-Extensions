name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override version (for manual runs). Leave blank to use version.json.'
        required: false

permissions:
  contents: write  # needed to create a GitHub Release

jobs:
  create-tag:
    name: Cut patch tag on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
      version: ${{ steps.cut.outputs.version }}
    runs-on: windows-2025-vs2026
    concurrency:
      group: release-tag-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute and push next patch tag
        id: cut
        shell: pwsh
        run: |
          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $latest = git tag --list 'v*' --sort=-version:refname |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($latest)) {
            $base = (Get-Content version.json | ConvertFrom-Json).version
            if ($base -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
              throw "version.json '$base' is not Major.Minor.Patch"
            }
            $major = [int]$matches[1]
            $minor = [int]$matches[2]
            $patch = [int]$matches[3]
          } else {
            if ($latest -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              throw "Latest tag '$latest' is not vMajor.Minor.Patch"
            }
            $major = [int]$matches[1]
            $minor = [int]$matches[2]
            $patch = [int]$matches[3]
          }

          do {
            $patch++
            $next = "v{0}.{1}.{2}" -f $major, $minor, $patch
            $exists = git tag --list $next
          } while (-not [string]::IsNullOrWhiteSpace($exists))

          git tag -a $next -m "Release $($next.Substring(1))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git push origin $next
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "tag=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($next.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  release:
    name: Build + Package + Release
    needs: [create-tag]
    if: >
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.create-tag.result == 'success') ||
        (startsWith(github.ref, 'refs/tags/v') && needs.create-tag.result == 'skipped') ||
        (github.event_name == 'workflow_dispatch' && needs.create-tag.result == 'skipped')
      )
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Install nbgv (pinned)
        shell: pwsh
        # Pinned to match the Nerdbank.GitVersioning PackageReference version
        # used by Installer/XISFInstaller/XISFInstaller.wixproj. Bump both
        # together (Dependabot will surface the wixproj bump as a PR; pair
        # this `--version` accordingly).
        run: dotnet tool install --tool-path . nbgv --version 3.9.50

      - name: Set cloud build variables (nbgv cloud)
        shell: pwsh
        run: ./nbgv cloud --all-vars

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $override = '${{ github.event.inputs.version_override }}'
          if ($override) {
            $v = $override
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            $v = '${{ needs.create-tag.outputs.version }}'
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } elseif ($env:NBGV_SemVer2) {
            $v = $env:NBGV_SemVer2
          } else {
            $v = (Get-Content version.json | ConvertFrom-Json).version
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z\.\-]+)?$') {
            throw "Version '$v' is not a valid SemVer."
          }
          $core = ($v -split '-')[0]
          "version=$core"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "full_version=$v"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$v"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build solution
        shell: pwsh
        run: |
          # /t:Rebuild = Clean + Build in one pass. The Clean half avoids the
          # stale-cache C2196 (RC/resource compiler "duplicate case value")
          # errors we hit on incremental builds; the Build half is what
          # actually produces the test DLLs and the shipped binaries.
          msbuild Win11-XISF-Shell-Extensions.sln `
            /t:Rebuild `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RestoreLockedMode=true `
            /p:XISFVersion=${{ steps.ver.outputs.version }} `
            /p:XISFBuildNumber=${{ github.run_number }} `
            /m /v:minimal /nologo

      - name: Setup VSTest
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at: $vswhere" }
          $vstest = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core `
            -find **\vstest.console.exe | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found via vswhere" }
          Split-Path $vstest | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "VSTest: $vstest"

      - name: Download OpenNGC catalogs (third-party, pinned)
        shell: pwsh
        run: |
          $catalogDir = Join-Path $env:LOCALAPPDATA 'XISFShellExtension\catalogs'
          New-Item -ItemType Directory -Path $catalogDir -Force | Out-Null
          $catalogs = @(
            @{
              Name = 'NGC.csv'
              Url  = 'https://raw.githubusercontent.com/mattiaverga/OpenNGC/36cb178a0f69dba8bfc03a99c10512831edf1c6b/database_files/NGC.csv'
              Sha256 = '840fe0c9ee1332e551b2e722a0e92726cd7b157914a3d2177602832aadd3aa9e'
            },
            @{
              Name = 'addendum.csv'
              Url  = 'https://raw.githubusercontent.com/mattiaverga/OpenNGC/36cb178a0f69dba8bfc03a99c10512831edf1c6b/database_files/addendum.csv'
              Sha256 = '1d8f0914e643ada325a5a94d88d8fefad6a4937a2f77cc34f21483af22b11983'
            }
          )
          foreach ($cat in $catalogs) {
            $dest = Join-Path $catalogDir $cat.Name
            Invoke-WebRequest -Uri $cat.Url -OutFile $dest -UseBasicParsing
            $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
            if ($hash -ne $cat.Sha256) {
              throw "SHA-256 mismatch for $($cat.Name): expected $($cat.Sha256), got $hash"
            }
            Write-Host "OK  $($cat.Name) ($hash)"
          }

      - name: Install project-hosted catalogs
        shell: pwsh
        run: |
          $catalogDir = Join-Path $env:LOCALAPPDATA 'XISFShellExtension\catalogs'
          New-Item -ItemType Directory -Path $catalogDir -Force | Out-Null
          # Parse expected SHA-256 values for project-hosted catalogs directly
          # from CatalogSpec.h. This way, bumping a hash in CatalogSpec.h after
          # editing data/*.csv is sufficient; no workflow edit required.
          $specPath = Join-Path $env:GITHUB_WORKSPACE 'ShellExtensionHost\ShellExtensionHost\src\CatalogSpec.h'
          if (-not (Test-Path $specPath)) { throw "CatalogSpec.h not found at $specPath" }
          $spec = Get-Content $specPath -Raw
          # Each CatalogSource literal: displayName, fileName, url (1+ string-literal continuations), expectedSha256, maxBytes.
          $pattern = 'CatalogSource\s+\w+\s*\{\s*L"[^"]*"\s*,\s*L"([^"]+)"\s*,\s*((?:L"[^"]*"\s*)+)\s*,\s*L"([0-9a-fA-F]{64})"'
          $projectMatches = @([regex]::Matches($spec, $pattern) |
            Where-Object { $_.Groups[2].Value -match 'raw\.githubusercontent\.com/dennispayne/XISF-Shell-Extensions/' })
          if ($projectMatches.Count -eq 0) {
            Write-Host "No project-hosted CatalogSource entries found in CatalogSpec.h - all catalogs use external URLs. Skipping."
            exit 0
          }
          foreach ($m in $projectMatches) {
            $fileName    = $m.Groups[1].Value
            $expectedSha = $m.Groups[3].Value.ToLower()
            $src  = Join-Path $env:GITHUB_WORKSPACE "data\$fileName"
            $dest = Join-Path $catalogDir $fileName
            if (-not (Test-Path $src)) { throw "Project data file not found: $src" }
            Copy-Item $src $dest -Force
            $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
            if ($hash -ne $expectedSha) {
              throw "SHA-256 mismatch for $fileName : expected $expectedSha (from CatalogSpec.h), got $hash. Update data/$fileName or CatalogSpec.h."
            }
            Write-Host "OK  $fileName ($hash)"
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          $tests = @(
            'x64\Release\XISFPropertyHandlerTests.dll',
            'x64\Release\XISFPreviewHandlerTests.dll',
            'x64\Release\ShellExtensionHostTests.dll',
            'x64\Release\XISFFilterTests.dll'
          ) | Where-Object { Test-Path $_ }
          vstest.console.exe $tests --Platform:x64 --Logger:trx --ResultsDirectory:TestResults

      - name: Build MSI installer
        shell: pwsh
        run: |
          msbuild Installer\XISFInstaller\XISFInstaller.wixproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RestoreLockedMode=true `
            /p:XISFVersion=${{ steps.ver.outputs.version }} `
            /m /v:minimal /nologo

      - name: Run installer tests
        shell: pwsh
        run: |
          # Skip InstallerIntegration tests on GitHub-hosted runners. The
          # release environment can install the MSI, but shell-backed calls
          # used by those tests (PSGetItemPropertyHandler / Shell.GetDetailsOf)
          # are not reliable there. Keep running the hermetic installer suites.
          dotnet test Installer\XISFInstallerTests\XISFInstallerTests.csproj `
            -c Release `
            -p:RestoreLockedMode=true `
            --filter "TestCategory!=InstallerIntegration" `
            --logger "trx;LogFileName=installer-tests.trx" `
            --results-directory TestResults

      - name: Stage release assets
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $msi = Get-ChildItem 'Installer\XISFInstaller\bin\**\*.msi' -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found after build.' }
          $destName = "XISF.ShellExtensions_${{ steps.ver.outputs.version }}_x64.msi"
          Copy-Item $msi.FullName (Join-Path $stage $destName)
          $h = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLower()
          "$h  $destName" | Set-Content (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          "release_dir=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem $stage

      - name: Compose release notes
        id: notes
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $repo = '${{ github.repository }}'
          $tags = @(git tag --list 'v*' --sort=version:refname)
          $idx = [Array]::IndexOf($tags, $tag)
          $prev = if ($idx -gt 0) { $tags[$idx - 1] } else { $null }
          $range = if ($prev) { "$prev..$tag" } else { $tag }

          $subjects = @(git log $range --pretty=format:'%s')
          $subjects = @($subjects | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $entries = @()
          foreach ($s in $subjects) {
            if ($s -match '^Merge ') { continue }
            $raw = $s.Trim()
            $component = 'General'
            $text = $raw
            if ($raw -match '^\[([^\]]+)\]\s*(.+)$') {
              $component = $matches[1].Trim()
              $text = $matches[2].Trim()
            }
            $entries += [pscustomobject]@{
              Component = $component
              Text = $text
              Raw = $raw
            }
          }
          if ($entries.Count -eq 0) {
            $entries = @($subjects | Select-Object -First 12 | ForEach-Object {
              [pscustomobject]@{ Component = 'General'; Text = $_; Raw = $_ }
            })
          }
          if ($entries.Count -eq 0) {
            $entries = @([pscustomobject]@{
              Component = 'General'
              Text = 'Release updates and maintenance improvements.'
              Raw = 'Release updates and maintenance improvements.'
            })
          }

          $priority = @{
            'PropertyHandler' = 1; 'PreviewHandler' = 2; 'IFilter' = 3; 'Host' = 4
            'Build' = 5; 'Test' = 6; 'Docs' = 7; 'General' = 8
          }
          $highlights = @(
            $entries |
              Sort-Object `
                @{ Expression = { if ($priority.ContainsKey($_.Component)) { $priority[$_.Component] } else { 99 } } }, `
                @{ Expression = { $_.Raw } } |
              Select-Object -ExpandProperty Raw -Unique -First 3
          )

          $compare = if ($prev) {
            "https://github.com/$repo/compare/$prev...$tag"
          } else {
            "https://github.com/$repo/releases/tag/$tag"
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $lines = @()
          $lines += '## Highlights'
          foreach ($h in $highlights) { $lines += "- $h" }
          $lines += ''
          $lines += '## What changed'
          $grouped = $entries | Group-Object Component | Sort-Object {
            if ($priority.ContainsKey($_.Name)) { $priority[$_.Name] } else { 99 }
          }
          foreach ($g in $grouped) {
            $lines += "### $($g.Name)"
            foreach ($item in ($g.Group | Select-Object -First 8)) {
              $lines += "- $($item.Text)"
            }
            $lines += ''
          }
          $lines += ''
          $lines += '## Compare'
          $lines += "- $compare"
          $lines | Set-Content -Path $notesPath -Encoding utf8
          "release_notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: ${{ steps.notes.outputs.release_notes_path }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.full_version, '-') }}
          files: |
            ${{ runner.temp }}/release-assets/*.msi
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-${{ steps.ver.outputs.full_version }}
          path: |
            ${{ runner.temp }}/release-assets/*.msi
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
