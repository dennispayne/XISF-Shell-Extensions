name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test (x64 Release)
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: '8.0.x'

      - name: Read version.json
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build solution
        shell: pwsh
        run: |
          # /t:Rebuild = Clean + Build in one pass. The Clean half avoids the
          # stale-cache C2196 (RC/resource compiler "duplicate case value")
          # errors we hit on incremental builds; the Build half is what
          # actually produces the test DLLs and the shipped binaries.
          msbuild Win11-XISF-Shell-Extensions.sln `
            /t:Rebuild `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RestoreLockedMode=true `
            /p:XISFVersion=${{ steps.ver.outputs.version }} `
            /p:XISFBuildNumber=${{ github.run_number }} `
            /m /v:minimal /nologo

      - name: Setup VSTest
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at: $vswhere" }
          $vstest = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core `
            -find **\vstest.console.exe | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found via vswhere" }
          Split-Path $vstest | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "VSTest: $vstest"

      - name: Download OpenNGC catalogs (third-party, pinned)
        shell: pwsh
        run: |
          $catalogDir = Join-Path $env:LOCALAPPDATA 'XISFShellExtension\catalogs'
          New-Item -ItemType Directory -Path $catalogDir -Force | Out-Null
          $catalogs = @(
            @{
              Name = 'NGC.csv'
              Url  = 'https://raw.githubusercontent.com/mattiaverga/OpenNGC/36cb178a0f69dba8bfc03a99c10512831edf1c6b/database_files/NGC.csv'
              Sha256 = '840fe0c9ee1332e551b2e722a0e92726cd7b157914a3d2177602832aadd3aa9e'
            },
            @{
              Name = 'addendum.csv'
              Url  = 'https://raw.githubusercontent.com/mattiaverga/OpenNGC/36cb178a0f69dba8bfc03a99c10512831edf1c6b/database_files/addendum.csv'
              Sha256 = '1d8f0914e643ada325a5a94d88d8fefad6a4937a2f77cc34f21483af22b11983'
            }
          )
          foreach ($cat in $catalogs) {
            $dest = Join-Path $catalogDir $cat.Name
            Invoke-WebRequest -Uri $cat.Url -OutFile $dest -UseBasicParsing
            $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
            if ($hash -ne $cat.Sha256) {
              throw "SHA-256 mismatch for $($cat.Name): expected $($cat.Sha256), got $hash"
            }
            Write-Host "OK  $($cat.Name) ($hash)"
          }

      - name: Install project-hosted catalogs
        shell: pwsh
        run: |
          $catalogDir = Join-Path $env:LOCALAPPDATA 'XISFShellExtension\catalogs'
          New-Item -ItemType Directory -Path $catalogDir -Force | Out-Null
          # Parse expected SHA-256 values for project-hosted catalogs directly
          # from CatalogSpec.h. This way, bumping a hash in CatalogSpec.h after
          # editing data/*.csv is sufficient; no workflow edit required.
          $specPath = Join-Path $env:GITHUB_WORKSPACE 'ShellExtensionHost\ShellExtensionHost\src\CatalogSpec.h'
          if (-not (Test-Path $specPath)) { throw "CatalogSpec.h not found at $specPath" }
          $spec = Get-Content $specPath -Raw
          # Each CatalogSource literal: displayName, fileName, url (1+ string-literal continuations), expectedSha256, maxBytes.
          $pattern = 'CatalogSource\s+\w+\s*\{\s*L"[^"]*"\s*,\s*L"([^"]+)"\s*,\s*((?:L"[^"]*"\s*)+)\s*,\s*L"([0-9a-fA-F]{64})"'
          $projectMatches = @([regex]::Matches($spec, $pattern) |
            Where-Object { $_.Groups[2].Value -match 'raw\.githubusercontent\.com/dennispayne/XISF-Shell-Extensions/' })
          if ($projectMatches.Count -eq 0) {
            throw "No project-hosted CatalogSource entries parsed from CatalogSpec.h - regex may need updating."
          }
          foreach ($m in $projectMatches) {
            $fileName    = $m.Groups[1].Value
            $expectedSha = $m.Groups[3].Value.ToLower()
            $src  = Join-Path $env:GITHUB_WORKSPACE "data\$fileName"
            $dest = Join-Path $catalogDir $fileName
            if (-not (Test-Path $src)) { throw "Project data file not found: $src" }
            Copy-Item $src $dest -Force
            $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
            if ($hash -ne $expectedSha) {
              throw "SHA-256 mismatch for $fileName : expected $expectedSha (from CatalogSpec.h), got $hash. Update data/$fileName or CatalogSpec.h."
            }
            Write-Host "OK  $fileName ($hash)"
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          $tests = @(
            'x64\Release\XISFPropertyHandlerTests.dll',
            'x64\Release\XISFPreviewHandlerTests.dll'
          ) | Where-Object { Test-Path $_ }
          if ($tests.Count -eq 0) { throw "No test DLLs found." }
          vstest.console.exe $tests --Platform:x64 --Logger:trx --ResultsDirectory:TestResults

      - name: Run performance tests (synthetic only)
        shell: pwsh
        run: |
          $perf = 'x64\Release\PerformanceTests.dll'
          if (Test-Path $perf) {
            vstest.console.exe $perf --Platform:x64 --Logger:trx --ResultsDirectory:TestResults\Perf
          } else {
            Write-Warning "PerformanceTests.dll not found — skipping perf tests"
          }

      - name: Run host and filter tests
        shell: pwsh
        run: |
          $extra = @(
            'x64\Release\ShellExtensionHostTests.dll',
            'x64\Release\XISFFilterTests.dll'
          ) | Where-Object { Test-Path $_ }
          if ($extra.Count -gt 0) {
            vstest.console.exe $extra --Platform:x64 --Logger:trx --ResultsDirectory:TestResults\Extra
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet build Installer\XISFInstaller\XISFInstaller.wixproj `
            -c Release `
            -p:RestoreLockedMode=true `
            -p:XISFVersion=${{ steps.ver.outputs.version }}

      - name: Run installer tests
        shell: pwsh
        run: |
          dotnet test Installer\XISFInstallerTests\XISFInstallerTests.csproj `
            -c Release `
            -p:RestoreLockedMode=true `
            --logger "trx;LogFileName=installer-tests.trx" `
            --results-directory TestResults

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: msi-unsigned
          path: Installer\XISFInstaller\bin\Release\**\*.msi
          if-no-files-found: error
