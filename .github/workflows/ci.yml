name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test (x64 Release)
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Read version.json
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build solution
        shell: pwsh
        run: |
          # /t:Rebuild = Clean + Build in one pass. The Clean half avoids the
          # stale-cache C2196 (RC/resource compiler "duplicate case value")
          # errors we hit on incremental builds; the Build half is what
          # actually produces the test DLLs and the shipped binaries.
          msbuild Win11-XISF-Shell-Extensions.sln `
            /t:Rebuild `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RestoreLockedMode=true `
            /p:XISFVersion=${{ steps.ver.outputs.version }} `
            /p:XISFBuildNumber=${{ github.run_number }} `
            /m /v:minimal /nologo

      - name: Setup VSTest
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at: $vswhere" }
          $vstest = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core `
            -find **\vstest.console.exe | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found via vswhere" }
          Split-Path $vstest | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "VSTest: $vstest"

      - name: Setup coverage tools
        shell: pwsh
        run: |
          # Pinned: dotnet-coverage merges native .coverage files to Cobertura;
          # ReportGenerator builds the markdown summary + HTML report.
          dotnet tool install --global dotnet-coverage --version 18.6.2
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.9
          # De-risk the runner image: explicitly add the global tools dir to PATH.
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download OpenNGC catalogs (third-party, pinned)
        shell: pwsh
        run: |
          $catalogDir = Join-Path $env:LOCALAPPDATA 'XISFShellExtension\catalogs'
          New-Item -ItemType Directory -Path $catalogDir -Force | Out-Null
          $catalogs = @(
            @{
              Name = 'NGC.csv'
              Url  = 'https://raw.githubusercontent.com/mattiaverga/OpenNGC/36cb178a0f69dba8bfc03a99c10512831edf1c6b/database_files/NGC.csv'
              Sha256 = '840fe0c9ee1332e551b2e722a0e92726cd7b157914a3d2177602832aadd3aa9e'
            },
            @{
              Name = 'addendum.csv'
              Url  = 'https://raw.githubusercontent.com/mattiaverga/OpenNGC/36cb178a0f69dba8bfc03a99c10512831edf1c6b/database_files/addendum.csv'
              Sha256 = '1d8f0914e643ada325a5a94d88d8fefad6a4937a2f77cc34f21483af22b11983'
            }
          )
          foreach ($cat in $catalogs) {
            $dest = Join-Path $catalogDir $cat.Name
            Invoke-WebRequest -Uri $cat.Url -OutFile $dest -UseBasicParsing
            $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
            if ($hash -ne $cat.Sha256) {
              throw "SHA-256 mismatch for $($cat.Name): expected $($cat.Sha256), got $hash"
            }
            Write-Host "OK  $($cat.Name) ($hash)"
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          $tests = @(
            'x64\Release\XISFPropertyHandlerTests.dll',
            'x64\Release\XISFPreviewHandlerTests.dll'
          ) | Where-Object { Test-Path $_ }
          if ($tests.Count -eq 0) { throw "No test DLLs found." }
          vstest.console.exe $tests --Platform:x64 --Logger:trx --ResultsDirectory:TestResults /Settings:CodeCoverage.runsettings

      - name: Run performance tests (synthetic only)
        shell: pwsh
        run: |
          $perf = 'x64\Release\PerformanceTests.dll'
          if (Test-Path $perf) {
            vstest.console.exe $perf --Platform:x64 --Logger:trx --ResultsDirectory:TestResults\Perf
          } else {
            Write-Warning "PerformanceTests.dll not found — skipping perf tests"
          }

      - name: Run host and filter tests
        shell: pwsh
        run: |
          $extra = @(
            'x64\Release\ShellExtensionHostTests.dll',
            'x64\Release\XISFFilterTests.dll'
          ) | Where-Object { Test-Path $_ }
          if ($extra.Count -gt 0) {
            vstest.console.exe $extra --Platform:x64 --Logger:trx --ResultsDirectory:TestResults\Extra /Settings:CodeCoverage.runsettings
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Generate coverage report
        if: always()
        shell: pwsh
        run: |
          # Native MS Code Coverage emits .coverage files under TestResults\<guid>\.
          # Find them, then merge to a single Cobertura XML for ReportGenerator.
          $coverage = Get-ChildItem -Path TestResults -Recurse -Filter *.coverage `
                       -ErrorAction SilentlyContinue
          if (-not $coverage -or $coverage.Count -eq 0) {
            Write-Warning "No .coverage files found under TestResults — skipping coverage report."
            return
          }
          Write-Host "Merging $($coverage.Count) .coverage file(s)..."
          $inputs = $coverage | ForEach-Object { $_.FullName }
          dotnet-coverage merge -o coverage.cobertura.xml -f cobertura @inputs
          if (-not (Test-Path coverage.cobertura.xml)) {
            Write-Warning "dotnet-coverage merge produced no output — skipping report."
            return
          }
          reportgenerator `
            -reports:coverage.cobertura.xml `
            -targetdir:CoverageReport `
            "-reporttypes:Html;MarkdownSummaryGithub;TextSummary"
          if (Test-Path CoverageReport\SummaryGithub.md) {
            "## Code Coverage" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content CoverageReport\SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if (Test-Path CoverageReport\Summary.txt) {
            Write-Host "----- Coverage summary -----"
            Get-Content CoverageReport\Summary.txt | Write-Host
          }

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-html
          path: |
            CoverageReport/**
            coverage.cobertura.xml
          if-no-files-found: warn

      - name: Build MSI installer
        shell: pwsh
        run: |
          msbuild Installer\XISFInstaller\XISFInstaller.wixproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RestoreLockedMode=true `
            /p:XISFVersion=${{ steps.ver.outputs.version }} `
            /m /v:minimal /nologo

      - name: Run installer tests
        shell: pwsh
        run: |
          # Skip InstallerIntegration tests in CI - they require a writable Windows
          # Shell that performs full property-handler resolution. GitHub Actions
          # Server runners install the MSI fine but PSGetItemPropertyHandler /
          # Shell.GetDetailsOf return E_FAIL / empty columns there, so the
          # integration suite is reserved for local elevated runs + the sandbox
          # E2E harness in Packaging/tests/. The hermetic MsiTests +
          # RuntimeLinkageTests suites still run here.
          dotnet test Installer\XISFInstallerTests\XISFInstallerTests.csproj `
            -c Release `
            -p:RestoreLockedMode=true `
            --filter "TestCategory!=InstallerIntegration" `
            --logger "trx;LogFileName=installer-tests.trx" `
            --results-directory TestResults

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: msi-unsigned
          path: Installer\XISFInstaller\bin\**\*.msi
          if-no-files-found: error
