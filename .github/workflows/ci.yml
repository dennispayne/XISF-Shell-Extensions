name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test (x64 Release)
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Read version.json
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build solution
        shell: pwsh
        run: |
          msbuild Win11-XISF-Shell-Extensions.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:XISFVersion=${{ steps.ver.outputs.version }} `
            /p:XISFBuildNumber=${{ github.run_number }} `
            /m /v:minimal /nologo

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.3

      - name: Run unit tests
        shell: pwsh
        run: |
          $tests = @(
            'x64\Release\XISFPropertyHandlerTests.dll',
            'x64\Release\XISFPreviewHandlerTests.dll'
          ) | Where-Object { Test-Path $_ }
          if ($tests.Count -eq 0) { throw "No test DLLs found." }
          vstest.console.exe $tests --Platform:x64 --Logger:trx --ResultsDirectory:TestResults

      - name: Run performance tests (synthetic only)
        shell: pwsh
        run: |
          $perf = 'x64\Release\PerformanceTests.dll'
          if (Test-Path $perf) {
            vstest.console.exe $perf --Platform:x64 --Logger:trx --ResultsDirectory:TestResults\Perf
          } else {
            Write-Warning "PerformanceTests.dll not found — skipping perf tests"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Stage MSIX build (validation only, no sign)
        shell: pwsh
        run: |
          .\Packaging\build-msix.ps1 `
            -Version ${{ steps.ver.outputs.version }} `
            -BuildNumber ${{ github.run_number }}

      - name: Upload MSIX artifacts (unsigned CI build)
        uses: actions/upload-artifact@v4
        with:
          name: msix-unsigned
          path: artifacts\*.msix
          if-no-files-found: error
